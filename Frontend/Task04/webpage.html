<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhotoFolio Gallery Demo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>


  <header class="navbar">
    <a href="#" class="logo"><i class="fa-solid fa-camera"></i> PhotoFolio</a>
    
    <nav class="nav-menu">
      <a href="#" class="nav-link active">Home</a>
      <a href="#" class="nav-link">About</a>
      <a href="#" class="nav-link">Gallery</a>
      <a href="#" class="nav-link">Services</a>
      <a href="#" class="nav-link">Contact</a>
    </nav>

    <div class="social-links">
      <a href="#" class="social-icon"><i class="fa-brands fa-twitter"></i></a>
      <a href="#" class="social-icon"><i class="fa-brands fa-facebook"></i></a>
      <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
    </div>
  </header>


  <main class="gallery-section">
    <div class="gallery-container">

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop" alt="Nature">
        <div class="overlay">
          <div class="actions">
            <a href="#"><i class="fa-solid fa-magnifying-glass-plus"></i></a>
            <a href="#"><i class="fa-solid fa-link"></i></a>
          </div>
          <h3>Tropical Beach</h3>
          <p>Nature / Ocean</p>
        </div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&auto=format&fit=crop" alt="Mountain">
        <div class="overlay">
          <div class="actions">
            <a href="#"><i class="fa-solid fa-magnifying-glass-plus"></i></a>
            <a href="#"><i class="fa-solid fa-link"></i></a>
          </div>
          <h3>Starry Night</h3>
          <p>Outdoors / Night</p>
        </div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&auto=format&fit=crop" alt="Foggy Forest">
        <div class="overlay">
          <div class="actions">
            <a href="#"><i class="fa-solid fa-magnifying-glass-plus"></i></a>
            <a href="#"><i class="fa-solid fa-link"></i></a>
          </div>
          <h3>Mist & Trees</h3>
          <p>Forest / Landscape</p>
        </div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600&auto=format&fit=crop" alt="Wilderness">
        <div class="overlay">
          <div class="actions">
            <a href="#"><i class="fa-solid fa-magnifying-glass-plus"></i></a>
            <a href="#"><i class="fa-solid fa-link"></i></a>
          </div>
          <h3>Alpine Path</h3>
          <p>Adventure</p>
        </div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=600&auto=format&fit=crop" alt="Woodland">
        <div class="overlay">
          <div class="actions">
            <a href="#"><i class="fa-solid fa-magnifying-glass-plus"></i></a>
            <a href="#"><i class="fa-solid fa-link"></i></a>
          </div>
          <h3>Autumn Foliage</h3>
          <p>Season / Colors</p>
        </div>
      </div>

      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600&auto=format&fit=crop" alt="Lake">
        <div class="overlay">
          <div class="actions">
            <a href="#"><i class="fa-solid fa-magnifying-glass-plus"></i></a>
            <a href="#"><i class="fa-solid fa-link"></i></a>
          </div>
          <h3>Serene Waters</h3>
          <p>Lakeside</p>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
