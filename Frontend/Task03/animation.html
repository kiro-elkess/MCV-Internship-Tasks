<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A retro Super Mario pure HTML & CSS animation showcasing pixel-perfect game elements and smooth animations.">
  <title>Super Mario Pure HTML & CSS Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="stage" role="img" aria-label="Super Mario animation scene with Mario running through a game level">
      <!-- Game HUD -->
      <div class="hud" aria-label="Game statistics">
        <div>MARIO<br><span>002500</span></div>
        <div>COINS<br><span>x08</span></div>
        <div>WORLD<br><span>1-1</span></div>
        <div>TIME<br><span>285</span></div>
      </div>

      <!-- Sky Elements -->
      <div class="cloud cloud-1" aria-hidden="true"></div>
      <div class="cloud cloud-2" aria-hidden="true"></div>

      <!-- Background Hills -->
      <div class="hill hill-1" aria-hidden="true"></div>
      <div class="hill hill-2" aria-hidden="true"></div>

      <!-- Blocks & Items -->
      <div class="block question-block" aria-label="Question mark block" role="img">
        <div class="item mushroom" aria-hidden="true"></div>
      </div>

      <!-- Pipe -->
      <div class="pipe" aria-label="Green warp pipe" role="img"></div>

      <!-- Characters -->
      <div class="goomba" aria-label="Goomba enemy" role="img"></div>
      <div class="mario" aria-label="Mario character" role="img"></div>

      <!-- Ground -->
      <div class="ground" aria-hidden="true"></div>
    </div>
  </main>
</body>
</html>
