<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Todos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle d-flex justify-content-center align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow rounded-3 border-0">
                    <div class="card-body p-4 bg-light">
                        <h2 class="text-center mb-4">Fetch Todos 📝</h2>
                        <button id="loadBtn" class="btn btn-primary w-100 mb-3 py-2 fw-semibold">
                            Load Todos
                        </button>
                        <ul id="todoList" class="list-group border-top border-bottom">
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
